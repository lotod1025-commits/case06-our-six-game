<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10191d">
  <title>마지막 셔터 | CASE 05</title>
  <meta name="description" content="사진관 10주년 전시 전날 밤. 현장을 조사하고 증거를 대조해 사건을 해결하세요.">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="flow.css">
<style>.case-collection-nav{display:flex;justify-content:flex-end;padding:7px 16px;background:#10191c;border-bottom:1px solid #3b5559;font:600 12px "Malgun Gothic",system-ui,sans-serif}.case-collection-nav a{color:#e4c18b;text-decoration:none;border:1px solid #746147;border-radius:7px;padding:6px 10px}.case-collection-nav a:hover,.case-collection-nav a:focus-visible{background:#344044;color:#fff}</style></head>
<body><div class="case-collection-nav"><a href="../cases.html">← 다른 사건 보기</a></div>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="aperture">◉</span><span><small>INTERACTIVE MYSTERY · CASE 05</small><strong>마지막 셔터</strong></span></div>
      <div class="topright"><span id="progress"></span><button id="reset" class="plain">처음부터</button></div>
    </header>
    <div class="layout">
      <nav aria-label="수사 메뉴">
        <button data-view="intro">인트로 다시 보기</button>
        <button data-view="brief">사건 개요</button>
        <button data-view="scene">현장 수색</button>
        <button data-view="interview">용의자 심문</button>
        <button data-view="records">CCTV · 기록</button>
        <button data-view="evidence">증거함 <span id="count">0</span></button>
        <button data-view="board">추리 보드</button>
        <button data-view="accuse" class="finalnav">최종 지목</button>
      </nav>
      <main id="main"></main>
      <aside id="note"></aside>
    </div>
  </div>
  <div id="modal" role="dialog" aria-modal="true" aria-label="증거 자세히 보기" hidden></div>
  <div id="toast" role="status"></div>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
